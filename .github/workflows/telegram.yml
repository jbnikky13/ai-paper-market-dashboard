name: AI Market Telegram Updates

on:
  schedule:
    # Runs every 4 hours
    - cron: "0 */4 * * *"

  # Allows you to run it manually from GitHub
  workflow_dispatch:

jobs:
  telegram-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Send market update to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          NGXPULSE_API_KEY: ${{ secrets.NGXPULSE_API_KEY }}
        run: |
          python telegram_bot.py
