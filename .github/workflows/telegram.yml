name: AI Market Telegram Updates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "telegram_bot.py"
      - "business_news.py"
      - "requirements.txt"
      - ".github/workflows/telegram.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: ai-market-telegram
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      INVESTO_API_KEY: ${{ secrets.INVESTO_API_KEY }}
      KOBO_API_KEY: ${{ secrets.KOBO_API_KEY }}
      NGXPULSE_API_KEY: ${{ secrets.NGXPULSE_API_KEY }}
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      INFERA_URL: https://infera-ten.vercel.app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore news state
        uses: actions/cache/restore@v4
        with:
          path: news_seen.json
          key: news-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-state-${{ github.ref_name }}-
      - name: Send market and news update
        run: python telegram_bot.py
      - name: Save news state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news_seen.json
          key: news-state-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
