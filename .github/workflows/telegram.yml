name: AI Market Telegram Updates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: ai-market-telegram
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      NGXPULSE_API_KEY: ${{ secrets.NGXPULSE_API_KEY }}
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore news state
        uses: actions/cache/restore@v4
        with:
          path: news_seen.json
          key: news-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            news-state-${{ github.ref_name }}-

      - name: Restore financial filing state
        uses: actions/cache/restore@v4
        with:
          path: financial_seen.json
          key: financial-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            financial-state-${{ github.ref_name }}-

      - name: Restore Nigeria IPO state
        uses: actions/cache/restore@v4
        with:
          path: ng_ipo_seen.json
          key: ng-ipo-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ng-ipo-state-${{ github.ref_name }}-

      - name: Send market and news update
        run: python telegram_bot.py

      - name: Send new quarterly financial updates
        run: python quarterly_financial_bot.py

      - name: Scan SEC Nigeria and NGX public offers
        run: python ng_ipo_bot.py

      - name: Save news state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news_seen.json
          key: news-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save financial filing state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: financial_seen.json
          key: financial-state-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save Nigeria IPO state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ng_ipo_seen.json
          key: ng-ipo-state-${{ github.ref_name }}-${{ github.run_id }}
