name: AI Market Telegram Updates

on:
  workflow_dispatch:
  schedule:
    # Every hour at minute 17 UTC
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: ai-market-telegram
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      NGXPULSE_API_KEY: ${{ secrets.NGXPULSE_API_KEY }}
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore news deduplication state
        uses: actions/cache@v4
        with:
          path: news_seen.txt
          key: news-seen-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            news-seen-${{ github.ref_name }}-

      - name: Send market and news update
        run: python telegram_bot.py

      - name: Check news deduplication state
        if: always()
        run: |
          echo "News state contains $(wc -l < news_seen.txt 2>/dev/null || echo 0) keys"
