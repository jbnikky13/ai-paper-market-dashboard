name: Validate Telegram Reporting

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run stock news source and report-capture tests
        run: python -m unittest discover -s tests -v
      - name: Inspect live news feeds and print Telegram preview (no delivery)
        run: python scripts/preview_stock_risk_report.py
